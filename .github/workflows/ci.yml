name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Validate benchmark answers
        run: python -c "from benchmark.answers_validate import assert_all_answers_valid; assert_all_answers_valid()"

      - name: Regenerate mock baseline
        run: python -m benchmark.run_experiment

      - name: Assert baseline unchanged
        run: git diff --exit-code experiments/mock_baseline/

      - name: Check experiment docs sync
        run: python scripts/sync_experiment_docs.py --check
