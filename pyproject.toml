[project]
name = "lexorchestra"
version = "0.1.0"
description = "Multi-model legal document orchestration with source-of-truth grounding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf"]
docx = ["python-docx"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docProcessing*", "benchmark*", "orchestrator*", "grounding*", "models*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
